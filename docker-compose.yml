services:
  rez-ai:
    build: .
    container_name: rez-ai
    restart: 'unless-stopped'
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - /home/david/data/rez.ai:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/recipes.db
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    labels:
      logging: "promtail"
      logging_jobname: "rez-ai"
      stackname: "rez-ai"
    networks:
      - default
      - monitoring
      - uptime-bridge
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: rez-elasticsearch
    restart: unless-stopped
    mem_limit: 800m
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx512m
    volumes:
      - /home/david/data/rez.ai/elasticsearch:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    labels:
      logging: "promtail"
      logging_jobname: "rez-elasticsearch"
      stackname: "rez-ai"
    networks:
      - default
      - uptime-bridge

networks:
  default: {}
  monitoring:
    name: monitoring_back-tier
    external: true
  uptime-bridge:
    name: uptime-bridge
    external: true
